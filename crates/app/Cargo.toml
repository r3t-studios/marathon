[package]
name = "app"
version = "0.1.0"
edition = "2021"

[features]
default = ["desktop"]
desktop = []  # macOS only
ios = []
headless = []

[dependencies]
libmarathon = { path = "../libmarathon" }
macros = { path = "../macros" }
inventory = { workspace = true }
rkyv = { workspace = true }
bevy = { version = "0.17", default-features = false, features = [
    # bevy_render, bevy_core_pipeline, bevy_pbr are now vendored in libmarathon
    "bevy_ui",
    "bevy_text",
    "png",
] }
egui = { version = "0.33", default-features = false, features = ["bytemuck", "default_fonts"] }
glam = "0.29"
winit = "0.30"
raw-window-handle = "0.6"
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
iroh = { version = "0.95", features = ["discovery-local-network"] }
iroh-gossip = "0.95"
futures-lite = "2.0"
bytes = "1.0"
crossbeam-channel = "0.5.15"
clap = { version = "4.0", features = ["derive"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"
tracing-oslog = "0.3"

[dev-dependencies]
iroh = { version = "0.95", features = ["discovery-local-network"] }
iroh-gossip = "0.95"
tempfile = "3"
futures-lite = "2.0"
rkyv = { workspace = true }
bytes = "1.0"

[lib]
name = "app"
crate-type = ["staticlib", "cdylib", "lib"]
