[package]
name = "client"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
# Bevy
bevy = { version = "0.17", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_ui",
    "bevy_text",
    "png",
    "x11",
] }

# Iroh - P2P networking and gossip
iroh = { workspace = true }
iroh-gossip = { workspace = true }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Local dependencies
lib = { path = "../lib" }
