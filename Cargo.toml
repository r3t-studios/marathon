[workspace]
members = ["crates/libmarathon", "crates/macros", "crates/app", "crates/xtask"]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"

# Iroh - P2P networking and gossip
iroh = { version = "0.95.0", features = ["discovery-pkarr-dht"] }
iroh-gossip = "0.95.0"

# Database
rusqlite = "0.37.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
rkyv = { version = "0.8", features = ["uuid-1", "bytes-1"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Random
rand = "0.8"

# Encoding
hex = "0.4"

# ML/AI
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = "0.20"
hf-hub = "0.3"

# Bevy
bevy = "0.17"

# Synchronization
parking_lot = "0.12"
crdts = "7.3"
inventory = "0.3"
